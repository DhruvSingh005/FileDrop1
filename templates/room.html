<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room {{ room_code }}</title>

    <!-- === PWA CONFIGURATION TAGS === -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#007bff">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
    <!-- ================================ -->

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    /* --- CSS VARIABLES FOR DARK MODE --- */
    :root {
        --bg-color: #f4f4f4;
        --container-bg: #fff;
        --text-color: #333;
        --text-muted: #555;
        --border-color: #eee;
        --drop-bg: #f8fbff;
        --drop-border: #007bff;
        --toast-bg: #333;
        --toast-text: #fff;
    }

    body.dark-mode {
        --bg-color: #121212;
        --container-bg: #1e1e1e;
        --text-color: #e0e0e0;
        --text-muted: #aaa;
        --border-color: #333;
        --drop-bg: #252525;
        --drop-border: #4dabf7;
        --toast-bg: #fff;
        --toast-text: #333;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        transition: background-color 0.3s, color 0.3s;
    }

    .theme-toggle {
        position: absolute;
        top: 20px;
        right: 20px;
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        z-index: 1000;
    }

    .container {
        max-width: 90%;
        width: 100%;
        background-color: var(--container-bg);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        box-sizing: border-box;
        transition: background-color 0.3s;
    }

    .presenter-mode-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-color);
        padding: 20px;
        box-sizing: border-box;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .presenter-mode-container.active { display: flex; }
    
    h1, h2 { color: var(--text-color); }
    #room-code-display { font-size: 2em; font-weight: bold; color: #007bff; letter-spacing: 2px; }
    
    .qr-code-section { margin-bottom: 20px; }
    
    .presenter-mode-btn { background-color: #17a2b8; color: white; padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    .presenter-mode-btn:hover { background-color: #138496; }
    
    .btn-close-room { background-color: #dc3545; color: white; padding: 10px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px; }
    .btn-close-room:hover { background-color: #c82333; }

    /* --- DRAG AND DROP STYLES --- */
    .drop-zone {
        max-width: 100%;
        height: 160px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        border: 3px dashed var(--drop-border);
        border-radius: 10px;
        background-color: var(--drop-bg);
        transition: all 0.2s ease;
        margin-top: 20px;
        box-sizing: border-box;
    }
    .drop-zone--over { border-style: solid; background-color: rgba(0, 123, 255, 0.1); }
    .drop-zone__input { display: none; }
    .drop-zone__prompt { color: var(--text-muted); font-size: 18px; font-weight: bold; pointer-events: none; }

    /* --- UPLOAD PROGRESS BAR --- */
    #progress-wrapper {
        width: 80%;
        background-color: var(--border-color);
        border-radius: 5px;
        margin-top: 15px;
        height: 10px;
        overflow: hidden;
        display: none;
    }
    #progress-bar {
        height: 100%;
        background-color: #28a745;
        width: 0%;
        transition: width 0.1s;
    }

    hr { border: 0; height: 1px; background: var(--border-color); margin: 30px 0; }
    ul { list-style: none; padding: 0; width: 100%; }
    li {
        background-color: var(--container-bg);
        padding: 15px;
        border: 1px solid var(--border-color);
        border-radius: 5px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }
    li > span { word-break: break-all; font-weight: 500; color: var(--text-color); }
    
    .action-buttons { display: flex; gap: 10px; align-items: center; margin-left: auto; }
    .action-buttons form { margin: 0; display: flex; align-items: center; }
    .btn-view { background-color: #17a2b8; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 14px; font-weight: bold; transition: background-color 0.2s; }
    .btn-view:hover { background-color: #138496; }
    .btn-download { background-color: #007bff; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 14px; font-weight: bold; transition: background-color 0.2s; }
    .btn-download:hover { background-color: #0056b3; }
    .btn-delete { background-color: #dc3545; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; transition: background-color 0.2s; }
    .btn-delete:hover { background-color: #c82333; }

    /* --- TOAST NOTIFICATIONS --- */
    #toast-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
    }
    .toast {
        background-color: var(--toast-bg);
        color: var(--toast-text);
        padding: 12px 20px;
        border-radius: 5px;
        margin-top: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.3s, transform 0.3s;
        font-weight: bold;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background-color: #dc3545; color: white; }
    .toast.success { background-color: #28a745; color: white; }

    @media (max-width: 600px) {
        .container { padding: 10px; }
        .action-buttons { width: 100%; justify-content: flex-start; margin-left: 0; }
        .theme-toggle { top: 10px; right: 10px; }
    }
    </style>
</head>
<body>
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-icon">🌓</button>

    <div class="container" id="manage-view">
        <h1>Room Code:</h1>
        
        <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px;">
            <p id="room-code-display" style="margin-bottom: 0;">{{ room_code }}</p>
            <button onclick="copyJoinLink()" style="padding: 8px 12px; background-color: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold;">Copy Link</button>
        </div>

        {% if is_presenter %}
        <div class="qr-code-section">
            <p style="color: var(--text-color);">Scan this QR code to join:</p>
            <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR Code" style="width: 200px; height: 200px; margin-top: 10px; border: 10px solid white; border-radius: 10px;">
            <br>
            <button class="presenter-mode-btn" onclick="togglePresenterMode()">Switch to Presenter View</button>
            
            <form id="close-room-form" action="{{ url_for('close_room', code=room_code) }}" method="post">
                <button type="button" class="btn-close-room" onclick="confirmCloseRoom()">Close Room & Delete All Files</button>
            </form>
        </div>
        {% endif %}

        <form id="upload-form">
            <div class="drop-zone" id="drop-zone">
                <span class="drop-zone__prompt">Drag & Drop files here<br><br><span style="font-size: 14px; font-weight: normal;">or click to browse</span></span>
                <input type="file" name="file" class="drop-zone__input" id="file-input" required>
                <!-- Progress Bar -->
                <div id="progress-wrapper">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </form>

        <hr>

        <h2>Uploaded Files</h2>
        <ul id="file-list"></ul>
    </div>

    <div class="presenter-mode-container" id="presenter-view">
        <h1 style="text-align: center;">Uploaded Files</h1>
        <ul id="presenter-file-list" style="width: 90%; max-width: 800px;"></ul>
        <button class="presenter-mode-btn" onclick="togglePresenterMode()">Exit Presenter View</button>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script>
        // --- THEME LOGIC ---
        const currentTheme = localStorage.getItem('theme') || 'light';
        const themeIcon = document.getElementById('theme-icon');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.innerText = "☀️";
        } else {
            themeIcon.innerText = "🌙";
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.innerText = isDark ? "☀️" : "🌙";
        }

        // --- TOAST NOTIFICATIONS ---
        function showToast(message, type = "success") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const fileList = document.getElementById('file-list');
        const presenterFileList = document.getElementById('presenter-file-list');
        const manageView = document.getElementById('manage-view');
        const presenterView = document.getElementById('presenter-view');
        const roomCode = "{{ room_code }}";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6cGdxbGZ1amZ5amZzdGZ4cWdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNTUzMDYsImV4cCI6MjEwNTgzMTMwNn0.x8YoHXC1fLz12dqak6DS2xt4r0A-aIcdoQ5dvOPqf7Q";
        const SUPABASE_URL = "https://qzpgqlfujfyjfstfxqgj.supabase.co";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        supabaseClient
            .channel('room-updates')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'files', filter: `room_code=eq.${roomCode}` }, payload => {
                fetchFiles(); 
            })
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'rooms', filter: `room_code=eq.${roomCode}` }, payload => {
                alert("This room has been closed by the presenter.");
                window.location.href = "/";
            })
            .subscribe();

        function copyJoinLink() {
            const joinUrl = `${window.location.origin}/join?code=${roomCode}`;
            navigator.clipboard.writeText(joinUrl).then(() => {
                showToast("Join link copied to clipboard!");
            }).catch(err => {
                showToast("Failed to copy link.", "error");
            });
        }

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const promptText = document.querySelector('.drop-zone__prompt');
        const progressWrapper = document.getElementById('progress-wrapper');
        const progressBar = document.getElementById('progress-bar');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drop-zone--over');
        });

        ['dragleave', 'dragend'].forEach(type => {
            dropZone.addEventListener(type, (e) => {
                dropZone.classList.remove('drop-zone--over');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drop-zone--over');
            if (e.dataTransfer.files.length) handleDirectUpload(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) handleDirectUpload(fileInput.files[0]);
        });

        // --- XHR UPLOAD WITH PROGRESS BAR ---
        function handleDirectUpload(file) {
            promptText.innerHTML = `Uploading ${file.name}...`;
            dropZone.style.pointerEvents = "none";
            progressWrapper.style.display = "block";
            progressBar.style.width = "0%";
            
            const filePath = `${roomCode}/${file.name}`;
            const storageApiUrl = `${SUPABASE_URL}/storage/v1/object/filedrop/${filePath}`;

            const xhr = new XMLHttpRequest();
            xhr.open('POST', storageApiUrl, true);
            xhr.setRequestHeader('Authorization', `Bearer ${SUPABASE_ANON_KEY}`);
            xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
            xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

            // Listen to progress
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressBar.style.width = percentComplete + '%';
                }
            };

            // Handle response
            xhr.onload = async function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    promptText.innerHTML = "Saving record...";
                    try {
                        const dbResponse = await fetch(`/save_file_record/${roomCode}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ filename: file.name })
                        });

                        if (!dbResponse.ok) throw new Error("Failed to save database record.");

                        showToast("File uploaded successfully!");
                        resetDropZone();
                        fetchFiles();

                    } catch (error) {
                        showToast("Failed to sync record.", "error");
                        resetDropZone("Upload Failed. Click to try again.");
                    }
                } else {
                    showToast("Storage upload failed.", "error");
                    resetDropZone("Upload Failed. Click to try again.");
                }
            };

            xhr.onerror = function() {
                showToast("Network error during upload.", "error");
                resetDropZone("Upload Failed. Click to try again.");
            };

            xhr.send(file);
        }

        function resetDropZone(text = "Drag & Drop files here<br><br><span style='font-size: 14px; font-weight: normal;'>or click to browse</span>") {
            promptText.innerHTML = text;
            dropZone.style.pointerEvents = "auto";
            progressWrapper.style.display = "none";
            fileInput.value = ""; // Reset input
        }

        function confirmCloseRoom() {
            const userInput = prompt(`WARNING: This will permanently close the room and delete ALL uploaded files.\n\nTo confirm, please type the room code: ${roomCode}`);
            if (userInput !== null && userInput.toUpperCase() === roomCode) {
                document.getElementById('close-room-form').submit();
            } else if (userInput !== null) {
                showToast("Room code did not match.", "error");
            }
        }

        function isImage(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            return ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
        }

        function updateFileLists(files, is_presenter) {
            fileList.innerHTML = '';
            presenterFileList.innerHTML = '';
            const filesData = files || [];

            if (filesData.length > 0) {
                filesData.forEach(file => {
                    const viewUrl = file.file_url; 
                    const downloadUrl = file.file_url + "?download=";

                    let fileDisplay = '';
                    if (isImage(file.filename)) {
                        fileDisplay = `
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <img src="${viewUrl}" alt="${file.filename}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border-color);">
                                <span style="word-break: break-all; font-weight: 500; color: var(--text-color);">${file.filename}</span>
                            </div>
                        `;
                    } else {
                        fileDisplay = `
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <div style="width: 45px; height: 45px; background-color: var(--border-color); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text-muted); font-weight: bold;">FILE</div>
                                <span style="word-break: break-all; font-weight: 500; color: var(--text-color);">${file.filename}</span>
                            </div>
                        `;
                    }

                    const manageLi = document.createElement('li');
                    const deleteBtn = is_presenter ? `
                        <form action="/delete_file/${roomCode}" method="post">
                            <input type="hidden" name="filename" value="${file.filename}">
                            <button type="submit" class="btn-delete">Delete</button>
                        </form>` : '';
                    
                    manageLi.innerHTML = `
                        ${fileDisplay}
                        <div class="action-buttons">
                            <a href="${viewUrl}" target="_blank" class="btn-view">View</a>
                            <a href="${downloadUrl}" class="btn-download">Download</a>
                            ${deleteBtn}
                        </div>
                    `;
                    fileList.appendChild(manageLi);

                    const presenterLi = document.createElement('li');
                    presenterLi.innerHTML = `
                        ${fileDisplay}
                        <div class="action-buttons">
                            <a href="${viewUrl}" target="_blank" class="btn-view">View</a>
                            <a href="${downloadUrl}" class="btn-download">Download</a>
                        </div>
                    `;
                    presenterFileList.appendChild(presenterLi);
                });
            } else {
                fileList.innerHTML = '<li style="justify-content: center; color: var(--text-muted);">No files have been uploaded yet.</li>';
                presenterFileList.innerHTML = '<li style="justify-content: center; color: var(--text-muted);">No files have been uploaded yet.</li>';
            }
        }

        async function fetchFiles() {
            try {
                const response = await fetch(`/files/${roomCode}`);
                const data = await response.json();
                if (data.room_exists) updateFileLists(data.files, data.is_presenter);
            } catch (error) { console.error('Error fetching files:', error); }
        }

        function togglePresenterMode() {
            if (presenterView.classList.contains('active')) {
                presenterView.classList.remove('active');
                manageView.style.display = 'block';
            } else {
                presenterView.classList.add('active');
                manageView.style.display = 'none';
            }
        }

        fetchFiles();
    </script>
</body>
</html>
