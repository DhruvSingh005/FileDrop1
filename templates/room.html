<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room {{ room_code }}</title>
    <!-- NEW: Supabase JS Library for Realtime WebSockets -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
    }
    .container {
        max-width: 90%;
        width: 100%;
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        box-sizing: border-box;
    }
    .presenter-mode-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f4f4f4;
        padding: 20px;
        box-sizing: border-box;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .presenter-mode-container.active {
        display: flex;
    }
    h1 {
        color: #333;
    }
    #room-code-display {
        font-size: 2em;
        font-weight: bold;
        color: #007bff;
        letter-spacing: 2px;
    }
    .qr-code-section {
        margin-bottom: 20px;
    }
    .presenter-mode-btn {
        background-color: #17a2b8;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
    }
    .presenter-mode-btn:hover {
        background-color: #138496;
    }
    
    .btn-close-room {
        background-color: #dc3545;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        margin-top: 15px;
    }
    .btn-close-room:hover {
        background-color: #c82333;
    }

    /* --- DRAG AND DROP STYLES --- */
    .drop-zone {
        max-width: 100%;
        height: 150px;
        padding: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        border: 3px dashed #007bff;
        border-radius: 10px;
        background-color: #f8fbff;
        transition: all 0.2s ease;
        margin-top: 20px;
        box-sizing: border-box;
    }
    .drop-zone--over {
        border-style: solid;
        background-color: #e2f0ff;
    }
    .drop-zone__input {
        display: none;
    }
    .drop-zone__prompt {
        color: #555;
        font-size: 18px;
        font-weight: bold;
        pointer-events: none;
    }
    /* ----------------------------- */

    hr {
        border: 0;
        height: 1px;
        background: #ccc;
        margin: 30px 0;
    }
    h2 {
        color: #555;
    }
    ul {
        list-style: none;
        padding: 0;
        width: 100%;
    }
    li {
        background-color: #f9f9f9;
        padding: 15px;
        border: 1px solid #eee;
        border-radius: 5px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }
    li > span {
        word-break: break-all;
        font-weight: 500;
        color: #333;
    }
    
    .action-buttons {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-left: auto;
    }
    .action-buttons form {
        margin: 0; 
        display: flex;
        align-items: center;
    }
    .btn-view {
        background-color: #17a2b8;
        color: white;
        padding: 8px 15px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        transition: background-color 0.2s;
    }
    .btn-view:hover {
        background-color: #138496;
        text-decoration: none;
    }
    .btn-download {
        background-color: #007bff;
        color: white;
        padding: 8px 15px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        transition: background-color 0.2s;
    }
    .btn-download:hover {
        background-color: #0056b3;
        text-decoration: none;
    }
    .btn-delete {
        background-color: #dc3545 !important;
        color: white !important;
        padding: 8px 15px !important;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px !important;
        font-weight: bold;
        width: auto !important; 
        transition: background-color 0.2s;
    }
    .btn-delete:hover {
        background-color: #c82333 !important;
    }
    
    @media (max-width: 600px) {
        .container {
            max-width: 100%;
            padding: 10px;
        }
        .action-buttons {
            width: 100%;
            justify-content: flex-start;
            margin-left: 0;
        }
    }
</style>
</head>
<body>
    <div class="container" id="manage-view">
        <h1>Room Code:</h1>
        
        <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px;">
            <p id="room-code-display" style="margin-bottom: 0;">{{ room_code }}</p>
            <button onclick="copyJoinLink()" style="padding: 8px 12px; background-color: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold;">Copy Link</button>
        </div>

        {% if is_presenter %}
        <div class="qr-code-section">
            <p>Scan this QR code to join:</p>
            <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR Code" style="width: 200px; height: 200px; margin-top: 10px;">
            <br>
            <button class="presenter-mode-btn" onclick="togglePresenterMode()">Switch to Presenter View</button>
            
            <form id="close-room-form" action="{{ url_for('close_room', code=room_code) }}" method="post">
                <button type="button" class="btn-close-room" onclick="confirmCloseRoom()">Close Room & Delete All Files</button>
            </form>
        </div>
        {% endif %}

        <form id="upload-form">
            <div class="drop-zone" id="drop-zone">
                <span class="drop-zone__prompt">Drag & Drop files here<br><br><span style="font-size: 14px; font-weight: normal;">or click to browse</span></span>
                <input type="file" name="file" class="drop-zone__input" id="file-input" required>
            </div>
        </form>

        <hr>

        <h2>Uploaded Files</h2>
        <ul id="file-list">
            </ul>
    </div>

    <div class="presenter-mode-container" id="presenter-view">
        <h1 style="text-align: center;">Uploaded Files</h1>
        <ul id="presenter-file-list" style="width: 100%;">
            </ul>
        <button class="presenter-mode-btn" onclick="togglePresenterMode()">Exit Presenter View</button>
    </div>

    <script>
        const fileList = document.getElementById('file-list');
        const presenterFileList = document.getElementById('presenter-file-list');
        const manageView = document.getElementById('manage-view');
        const presenterView = document.getElementById('presenter-view');
        const roomCode = "{{ room_code }}";

        // --- DIRECT-TO-STORAGE & REALTIME CONFIGURATION ---
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6cGdxbGZ1amZ5amZzdGZ4cWdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNTUzMDYsImV4cCI6MjEwNTgzMTMwNn0.x8YoHXC1fLz12dqak6DS2xt4r0A-aIcdoQ5dvOPqf7Q"; // <-- PASTE YOUR KEY HERE
        const SUPABASE_URL = "https://qzpgqlfujfyjfstfxqgj.supabase.co";

        // Initialize Supabase Client for Realtime WebSockets
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // NEW: Realtime Subscription
        // This listens to the database directly and updates the UI instantly
        supabase
            .channel('room-updates')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'files', filter: `room_code=eq.${roomCode}` }, payload => {
                console.log('Realtime change detected:', payload);
                fetchFiles(); // Instantly fetch the updated list
            })
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'rooms', filter: `room_code=eq.${roomCode}` }, payload => {
                alert("This room has been closed by the presenter.");
                window.location.href = "/";
            })
            .subscribe();

        function copyJoinLink() {
            const joinUrl = `${window.location.origin}/join?code=${roomCode}`;
            navigator.clipboard.writeText(joinUrl).then(() => {
                alert("Join link copied to clipboard!");
            }).catch(err => {
                console.error('Failed to copy link: ', err);
                alert("Failed to copy link. Please check your browser permissions.");
            });
        }

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const promptText = document.querySelector('.drop-zone__prompt');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drop-zone--over');
        });

        ['dragleave', 'dragend'].forEach(type => {
            dropZone.addEventListener(type, (e) => {
                dropZone.classList.remove('drop-zone--over');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drop-zone--over');
            if (e.dataTransfer.files.length) {
                handleDirectUpload(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                handleDirectUpload(fileInput.files[0]);
            }
        });

        async function handleDirectUpload(file) {
            promptText.innerHTML = `Uploading ${file.name}...`;
            dropZone.style.pointerEvents = "none";
            
            const filePath = `${roomCode}/${file.name}`;
            const storageApiUrl = `${SUPABASE_URL}/storage/v1/object/filedrop/${filePath}`;

            try {
                const uploadResponse = await fetch(storageApiUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': file.type || 'application/octet-stream'
                    },
                    body: file
                });

                if (!uploadResponse.ok) {
                    throw new Error("Failed to upload file to storage.");
                }

                promptText.innerHTML = "Saving record...";

                const dbResponse = await fetch(`/save_file_record/${roomCode}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ filename: file.name })
                });

                if (!dbResponse.ok) {
                    throw new Error("Failed to save database record.");
                }

                promptText.innerHTML = "Drag & Drop files here<br><br><span style='font-size: 14px; font-weight: normal;'>or click to browse</span>";
                dropZone.style.pointerEvents = "auto";
                // Note: We don't need to manually call fetchFiles() here anymore, 
                // because the Realtime listener will automatically trigger it!

            } catch (error) {
                console.error("Upload error:", error);
                alert("Upload failed. Make sure your bucket allows public INSERT policies.");
                promptText.innerHTML = "Upload Failed. Click to try again.";
                dropZone.style.pointerEvents = "auto";
            }
        }

        function confirmCloseRoom() {
            const userInput = prompt(`WARNING: This will permanently close the room and delete ALL uploaded files.\n\nTo confirm, please type the room code: ${roomCode}`);
            
            if (userInput !== null && userInput.toUpperCase() === roomCode) {
                document.getElementById('close-room-form').submit();
            } else if (userInput !== null) {
                alert("Room code did not match. Room was not closed.");
            }
        }

        function isImage(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            return ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
        }

        function updateFileLists(files, is_presenter) {
            fileList.innerHTML = '';
            presenterFileList.innerHTML = '';
            const filesData = files || [];

            if (filesData.length > 0) {
                filesData.forEach(file => {
                    const viewUrl = file.file_url; 
                    const downloadUrl = file.file_url + "?download=";

                    let fileDisplay = '';
                    if (isImage(file.filename)) {
                        fileDisplay = `
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <img src="${viewUrl}" alt="${file.filename}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd;">
                                <span style="word-break: break-all; font-weight: 500; color: #333;">${file.filename}</span>
                            </div>
                        `;
                    } else {
                        fileDisplay = `
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <div style="width: 45px; height: 45px; background-color: #e9ecef; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #6c757d; font-weight: bold;">FILE</div>
                                <span style="word-break: break-all; font-weight: 500; color: #333;">${file.filename}</span>
                            </div>
                        `;
                    }

                    const manageLi = document.createElement('li');
                    
                    const deleteBtn = is_presenter ? `
                        <form action="/delete_file/${roomCode}" method="post">
                            <input type="hidden" name="filename" value="${file.filename}">
                            <button type="submit" class="btn-delete">Delete</button>
                        </form>` : '';
                    
                    manageLi.innerHTML = `
                        ${fileDisplay}
                        <div class="action-buttons">
                            <a href="${viewUrl}" target="_blank" class="btn-view">View</a>
                            <a href="${downloadUrl}" class="btn-download">Download</a>
                            ${deleteBtn}
                        </div>
                    `;
                    fileList.appendChild(manageLi);

                    const presenterLi = document.createElement('li');
                    presenterLi.innerHTML = `
                        ${fileDisplay}
                        <div class="action-buttons">
                            <a href="${viewUrl}" target="_blank" class="btn-view">View</a>
                            <a href="${downloadUrl}" class="btn-download">Download</a>
                        </div>
                    `;
                    presenterFileList.appendChild(presenterLi);
                });
            } else {
                fileList.innerHTML = '<li style="justify-content: center; color: #777;">No files have been uploaded yet.</li>';
                presenterFileList.innerHTML = '<li style="justify-content: center; color: #777;">No files have been uploaded yet.</li>';
            }
        }

        async function fetchFiles() {
            try {
                const response = await fetch(`/files/${roomCode}`);
                const data = await response.json();
                
                // Room deletion logic is now handled by Realtime listener above
                if (data.room_exists) {
                    updateFileLists(data.files, data.is_presenter);
                }
            } catch (error) {
                console.error('Error fetching files:', error);
            }
        }

        function togglePresenterMode() {
            if (presenterView.classList.contains('active')) {
                presenterView.classList.remove('active');
                manageView.style.display = 'block';
            } else {
                presenterView.classList.add('active');
                manageView.style.display = 'none';
            }
        }

        // REMOVED: setInterval(fetchFiles, 3000); 
        // We no longer need to poll the server constantly!
        fetchFiles(); // Fetch once on load, Realtime handles the rest
    </script>
</body>
</html>
