<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room {{ room_code }}</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
    }
    .container {
        max-width: 90%;
        width: 100%;
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        box-sizing: border-box;
    }
    .presenter-mode-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f4f4f4;
        padding: 20px;
        box-sizing: border-box;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .presenter-mode-container.active {
        display: flex;
    }
    h1 {
        color: #333;
    }
    #room-code-display {
        font-size: 2em;
        font-weight: bold;
        color: #007bff;
        letter-spacing: 2px;
        margin-bottom: 20px;
    }
    .qr-code-section {
        margin-bottom: 20px;
    }
    .presenter-mode-btn {
        background-color: #17a2b8;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
    }
    .presenter-mode-btn:hover {
        background-color: #138496;
    }
    form {
        margin-top: 20px;
    }
    input[type="file"] {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 10px;
    }
    button[type="submit"] {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        box-sizing: border-box;
    }
    button[type="submit"]:hover {
        background-color: #218838;
    }
    hr {
        border: 0;
        height: 1px;
        background: #ccc;
        margin: 30px 0;
    }
    h2 {
        color: #555;
    }
    ul {
        list-style: none;
        padding: 0;
        width: 100%;
    }
    li {
        background-color: #f9f9f9;
        padding: 15px;
        border: 1px solid #eee;
        border-radius: 5px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }
    li > span {
        word-break: break-all;
        font-weight: 500;
        color: #333;
    }
    
    /* --- ACTION BUTTON STYLES --- */
    .action-buttons {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-left: auto;
    }
    .action-buttons form {
        margin: 0; 
        display: flex;
        align-items: center;
    }
    .btn-view {
        background-color: #17a2b8; /* Teal color for View */
        color: white;
        padding: 8px 15px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        transition: background-color 0.2s;
    }
    .btn-view:hover {
        background-color: #138496;
        text-decoration: none;
    }
    .btn-download {
        background-color: #007bff;
        color: white;
        padding: 8px 15px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        transition: background-color 0.2s;
    }
    .btn-download:hover {
        background-color: #0056b3;
        text-decoration: none;
    }
    .btn-delete {
        background-color: #dc3545 !important;
        color: white !important;
        padding: 8px 15px !important;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px !important;
        font-weight: bold;
        width: auto !important; 
        transition: background-color 0.2s;
    }
    .btn-delete:hover {
        background-color: #c82333 !important;
    }
    /* ------------------------------------- */

    @media (max-width: 600px) {
        .container {
            max-width: 100%;
            padding: 10px;
        }
        .action-buttons {
            width: 100%;
            justify-content: flex-start;
            margin-left: 0;
        }
    }
</style>
</head>
<body>
    <div class="container" id="manage-view">
        <h1>Room Code:</h1>
        <p id="room-code-display">{{ room_code }}</p>

        {% if is_presenter %}
        <div class="qr-code-section">
            <p>Scan this QR code to join:</p>
            <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR Code" style="width: 200px; height: 200px; margin-top: 10px;">
            <br>
            <button class="presenter-mode-btn" onclick="togglePresenterMode()">Switch to Presenter View</button>
        </div>
        {% endif %}

        <form action="{{ url_for('upload_file', code=room_code) }}" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">Upload File</button>
        </form>

        <hr>

        <h2>Uploaded Files</h2>
        <ul id="file-list">
            </ul>
    </div>

    <div class="presenter-mode-container" id="presenter-view">
        <h1 style="text-align: center;">Uploaded Files</h1>
        <ul id="presenter-file-list" style="width: 100%;">
            </ul>
        <button class="presenter-mode-btn" onclick="togglePresenterMode()">Exit Presenter View</button>
    </div>

    <script>
        const fileList = document.getElementById('file-list');
        const presenterFileList = document.getElementById('presenter-file-list');
        const manageView = document.getElementById('manage-view');
        const presenterView = document.getElementById('presenter-view');
        const roomCode = "{{ room_code }}";

        function updateFileLists(files, is_presenter) {
            fileList.innerHTML = '';
            presenterFileList.innerHTML = '';
            const filesData = files || [];

            if (filesData.length > 0) {
                filesData.forEach(file => {
                    const viewUrl = file.file_url; 
                    const downloadUrl = file.file_url + "?download="; // Forces the browser to download instead of opening

                    const manageLi = document.createElement('li');
                    
                    const deleteBtn = is_presenter ? `
                        <form action="/delete_file/${roomCode}" method="post">
                            <input type="hidden" name="filename" value="${file.filename}">
                            <button type="submit" class="btn-delete">Delete</button>
                        </form>` : '';
                    
                    manageLi.innerHTML = `
                        <span>${file.filename}</span>
                        <div class="action-buttons">
                            <a href="${viewUrl}" target="_blank" class="btn-view">View</a>
                            <a href="${downloadUrl}" class="btn-download">Download</a>
                            ${deleteBtn}
                        </div>
                    `;
                    fileList.appendChild(manageLi);

                    const presenterLi = document.createElement('li');
                    presenterLi.innerHTML = `
                        <span>${file.filename}</span>
                        <div class="action-buttons">
                            <a href="${viewUrl}" target="_blank" class="btn-view">View</a>
                            <a href="${downloadUrl}" class="btn-download">Download</a>
                        </div>
                    `;
                    presenterFileList.appendChild(presenterLi);
                });
            } else {
                fileList.innerHTML = '<li style="justify-content: center; color: #777;">No files have been uploaded yet.</li>';
                presenterFileList.innerHTML = '<li style="justify-content: center; color: #777;">No files have been uploaded yet.</li>';
            }
        }

        async function fetchFiles() {
            try {
                const response = await fetch(`/files/${roomCode}`);
                const data = await response.json();
                updateFileLists(data.files, data.is_presenter);
            } catch (error) {
                console.error('Error fetching files:', error);
            }
        }

        function togglePresenterMode() {
            if (presenterView.classList.contains('active')) {
                presenterView.classList.remove('active');
                manageView.style.display = 'block';
            } else {
                presenterView.classList.add('active');
                manageView.style.display = 'none';
            }
        }

        setInterval(fetchFiles, 3000);
        fetchFiles();
    </script>
</body>
</html>
