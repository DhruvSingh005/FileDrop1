<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileDrop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            border: none;
            display: inline-block;
            vertical-align: middle;
            line-height: 1.2;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        
        /* Mobile responsive styles */
        @media (max-width: 640px) {
            .container {
                padding: 20px;
                margin: 10px;
                width: calc(100% - 20px);
                box-sizing: border-box;
            }
            .btn {
                display: block;
                width: 100%;
                margin: 10px 0;
                padding: 15px;
                box-sizing: border-box;
                font-size: 16px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to FileDrop</h1>
        <p>Please choose an option to get started.</p>
        <a href="/create" class="btn">Create Room</a>
        <a href="/join" class="btn">Join Room</a>
    </div>
</body>
</html>
