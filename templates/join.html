<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Room</title>

    <!-- === PWA CONFIGURATION TAGS === -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#007bff">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
    
    <!-- === QR SCANNER LIBRARY === -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        /* --- CSS VARIABLES FOR DARK MODE --- */
        :root {
            --bg-color: #f4f4f4;
            --container-bg: #fff;
            --text-color: #333;
            --text-muted: #888;
            --input-bg: #fff;
            --input-border: #ccc;
            --divider-border: #ddd;
        }

        body.dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #aaa;
            --input-bg: #2a2a2a;
            --input-border: #444;
            --divider-border: #333;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
        }

        .container {
            text-align: center;
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            transition: background-color 0.3s;
        }
        
        h1 {
            color: var(--text-color);
            margin-top: 0;
        }
        
        .join-form {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .join-form input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            text-transform: uppercase;
            width: 60%;
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }
        
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary { background-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }
        
        .btn-scan {
            background-color: #28a745;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        .btn-scan:hover { background-color: #218838; }

        .divider {
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--divider-border);
            margin: 0 10px;
            transition: border-color 0.3s;
        }
        
        .error {
            color: #dc3545;
            margin-top: 10px;
            font-weight: bold;
        }
        
        #reader {
            width: 100%;
            margin-top: 20px;
            display: none; 
        }

        /* Ensure scanner text remains readable in dark mode */
        #reader a { color: #007bff; }
        #reader span { color: var(--text-color); }

        @media (max-width: 640px) {
            .theme-toggle {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-icon">🌙</button>

    <div class="container">
        <h1>Join a Room</h1>
        
        <form class="join-form" action="/join" method="post" id="joinForm">
            <input type="text" name="code" id="codeInput" placeholder="Enter Code" required maxlength="5" minlength="5">
            <button type="submit" class="btn btn-primary">Join</button>
        </form>

        <p class="error">{{ error_message }}</p>

        <div class="divider">OR</div>

        <button type="button" class="btn btn-scan" id="startScanBtn" onclick="startScanner()">📷 Scan QR Code</button>
        
        <!-- The camera feed will appear inside this div -->
        <div id="reader"></div>
    </div>

    <script>
        // --- THEME LOGIC ---
        const currentTheme = localStorage.getItem('theme') || 'light';
        const themeIcon = document.getElementById('theme-icon');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.innerText = "☀️";
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.innerText = isDark ? "☀️" : "🌙";
        }

        // --- QR SCANNER LOGIC ---
        let html5QrcodeScanner = null;

        function startScanner() {
            const readerDiv = document.getElementById('reader');
            const scanBtn = document.getElementById('startScanBtn');
            
            readerDiv.style.display = 'block';
            scanBtn.style.display = 'none';

            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { fps: 10, qrbox: {width: 250, height: 250} },
                false
            );

            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        function onScanSuccess(decodedText, decodedResult) {
            try {
                let url = new URL(decodedText);
                let code = url.searchParams.get("code");
                
                if (code) {
                    html5QrcodeScanner.clear();
                    
                    document.getElementById('codeInput').value = code;
                    document.getElementById('joinForm').submit();
                } else {
                    alert("Invalid FileDrop QR Code. No room code found.");
                }
            } catch (e) {
                alert("Invalid QR Code format. Please scan a valid FileDrop code.");
            }
        }

        function onScanFailure(error) {
            // Ignored continuously during scanning
        }
    </script>
</body>
</html>
